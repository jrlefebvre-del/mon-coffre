<!doctype html>
<html lang="fr">
<head>

<title>Mon Coffre</title>
<style>
  :root {
    --bg: #0e161a; --card: #1a252d; --border: #2a3a44; --green: #24c773;
    --text: #e7eef3; --muted: #9baebb; --red: #ff6b6b;
    --top: env(safe-area-inset-top); --bottom: env(safe-area-inset-bottom);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh; padding-bottom: calc(var(--bottom) + 24px); }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
  header.bar { position: sticky; top: 0; z-index: 5; background: rgba(14,22,26,.94);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    padding: calc(var(--top) + 10px) 0 10px; border-bottom: 1px solid var(--border); }
  header.bar .row { display: flex; align-items: center; gap: 8px; }
  header.bar h1 { flex: 1; margin: 0; font-size: 22px; }
  .icon-btn { min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); font-size: 20px; cursor: pointer; }
  .back { background: none; border: 0; color: var(--green); font-size: 17px; min-height: 44px; padding: 0 4px; cursor: pointer; }
  .search { width: 100%; margin-top: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); font-size: 17px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 20px; margin: 16px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .label { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  .value { word-break: break-word; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
    padding: 8px 16px; border-radius: 12px; border: 1px solid var(--border); background: #22313b; cursor: pointer; }
  .btn.primary { width: 100%; min-height: 56px; background: var(--green); border-color: var(--green); color: var(--bg); font-weight: 700; border-radius: 18px; }

  .site { display: flex; align-items: center; width: 100%; min-height: 60px; padding: 16px 18px; margin-bottom: 9px;

  .site span { flex: 1; word-break: break-word; }
  .site::after { content: "›"; color: var(--muted); font-size: 22px; }
  .list { padding-right: 46px; }
  .rail { position: fixed; right: calc(env(safe-area-inset-right) + 6px); top: calc(var(--top) + 140px); bottom: calc(var(--bottom) + 16px);
    width: 36px; display: flex; flex-direction: column; justify-content: space-between; padding: 6px 0;
    background: rgba(26,37,45,.8); border: 1px solid var(--border); border-radius: 14px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .rail b { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); opacity: .45; }
  .rail b.on { color: var(--green); opacity: 1; }
  .rail b.sel { background: rgba(36,199,115,.22); border-radius: 8px; }
  .hero { text-align: center; padding-top: calc(var(--top) + 48px); }

    background: var(--green); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; z-index: 20; }
  .link { color: var(--green); background: none; border: 0; padding: 8px 0; text-decoration: underline; cursor: pointer; }

  input[type=range] { width: 100%; accent-color: var(--green); }

<body>
<div id="app"></div>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Mon Coffre (version web installable / PWA)
// Les identifiants sont chiffrés (AES-256-GCM) avec une clé tirée du mot de passe
// maître (PBKDF2-SHA256, 600 000 tours) et stockés uniquement sur l'appareil.
// Rien n'est jamais envoyé sur Internet.
// ---------------------------------------------------------------------------
const STORE = 'moncoffre.v1';
const ITER = 600000;
const LOCK_MS = 2 * 60 * 1000;
const enc = new TextEncoder(), dec = new TextDecoder();
const app = document.getElementById('app');
const S = { key: null, salt: null, iter: ITER, entries: [], search: '', last: Date.now(), busy: false, keepOpen: false, gen: 0 };

// ---------- petits outils ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
}
function show(...nodes) { app.replaceChildren(...nodes); window.scrollTo(0, 0); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = h('div', { class: 'toast', role: 'status', text: msg });
  document.body.append(t); setTimeout(() => t.remove(), 3500);
}
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : toB64(rand(16)));
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// ---------- chiffrement ----------
// Clé brute (32 octets) tirée du mot de passe maître ; gardée en mémoire seulement le temps
// de proposer Face ID, puis effacée au verrouillage.
async function deriveRaw(password, salt, iter) {
  const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, 256));
}
const keyFromRaw = raw => crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
async function seal(key, salt, iter, entries) {
  const iv = rand(12);
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(entries))));
  return { app: 'MonCoffre', v: 1, kdf: 'PBKDF2-SHA256', iter, salt: toB64(salt), iv: toB64(iv), data: toB64(data) };
}
function clean(e) {
  const s = v => (typeof v === 'string' ? v : '');
  return { id: s(e && e.id) || uid(), site: s(e && e.site), url: s(e && e.url), client: s(e && e.client), login: s(e && e.login), password: s(e && e.password) };
}
function checkBlob(blob) {
  if (!blob || blob.app !== 'MonCoffre' || blob.v !== 1 || !blob.salt || !blob.iv || !blob.data) throw new Error('Fichier de coffre non reconnu.');
  const iter = Number(blob.iter);
  if (!(iter >= 100000 && iter <= 10000000)) throw new Error('Fichier de coffre non reconnu.');
  return iter;
}
async function openWithKey(blob, key, wrongMessage) {
  let plain;
  try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(blob.iv) }, key, fromB64(blob.data)); }
  catch { throw new Error(wrongMessage); }
  const list = JSON.parse(dec.decode(plain));
  if (!Array.isArray(list)) throw new Error('Contenu du coffre endommagé.');
  return list.map(clean);
}
async function unseal(blob, password) {
  const iter = checkBlob(blob);
  const salt = fromB64(blob.salt);
  const raw = await deriveRaw(password, salt, iter);
  const key = await keyFromRaw(raw);
  const entries = await openWithKey(blob, key, 'Mot de passe incorrect.');
  return { key, raw, salt, iter, entries };
}

// ---------- Face ID / code de l'iPhone (clé d'accès WebAuthn + extension PRF) ----------
// La clé d'accès, gardée par l'iPhone, fournit un secret uniquement après Face ID / code.
// Ce secret chiffre la clé du coffre ; sans lui, la copie stockée est inutilisable.
const BIO = 'moncoffre.bio';
function readBio() {
  try {
    const b = JSON.parse(localStorage.getItem(BIO)), s = readStore();
    if (b && s && b.vaultSalt === s.salt) return b;
  } catch {}
  return null;
}
async function bioSupported() {
  if (!window.PublicKeyCredential || !window.isSecureContext) return false;
  try {
    if (PublicKeyCredential.getClientCapabilities) {
      const caps = await PublicKeyCredential.getClientCapabilities();
      if (caps && caps['extension:prf'] === false) return false;
    }
    return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  } catch { return false; }
}
async function prfKey(secret) {
  const base = await crypto.subtle.importKey('raw', secret, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'HKDF', hash: 'SHA-256', salt: enc.encode('MonCoffre-FaceID-v1'), info: new Uint8Array() },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function withKeepOpen(fn) {
  S.keepOpen = true;
  try { return await fn(); } finally { setTimeout(() => { S.keepOpen = false; }, 1500); }
}
async function bioAssert(credId, prfSalt) {
  const cred = await withKeepOpen(() => navigator.credentials.get({ publicKey: {
    challenge: rand(32), rpId: location.hostname, timeout: 60000, userVerification: 'required',
    allowCredentials: [{ type: 'public-key', id: credId }],
    extensions: { prf: { eval: { first: prfSalt } } } } }));
  const r = cred && cred.getClientExtensionResults().prf;
  if (!r || !r.results || !r.results.first) throw new Error('Cet iPhone ne permet pas Face ID pour Mon Coffre (iOS 18 ou plus récent requis).');
  return new Uint8Array(r.results.first);
}
async function storeBio(raw, credId, prfSalt, secret) {
  const k = await prfKey(secret), iv = rand(12);
  const wrapped = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, raw));
  localStorage.setItem(BIO, JSON.stringify({ credId: toB64(credId), prfSalt: toB64(prfSalt), iv: toB64(iv), wrapped: toB64(wrapped), vaultSalt: readStore().salt }));
}
// Étape 1 : créer la clé d'accès. Renvoie true si Face ID est activé, ou une fonction « finir »
// à lancer sur un second appui si l'iPhone n'a pas fourni le secret dès la création.
async function enableBio(raw) {
  const prfSalt = rand(32);
  const cred = await withKeepOpen(() => navigator.credentials.create({ publicKey: {
    rp: { name: 'Mon Coffre', id: location.hostname },
    user: { id: rand(16), name: 'Mon Coffre', displayName: 'Mon Coffre' },
    challenge: rand(32), timeout: 60000,
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
    authenticatorSelection: { authenticatorAttachment: 'platform', residentKey: 'preferred', userVerification: 'required' },
    extensions: { prf: { eval: { first: prfSalt } } } } }));
  const ext = cred.getClientExtensionResults().prf;
  if (!ext || ext.enabled === false) throw new Error('Cet iPhone ne permet pas Face ID pour Mon Coffre (iOS 18 ou plus récent requis). Continuez avec le mot de passe maître.');
  const credId = new Uint8Array(cred.rawId);
  if (ext.results && ext.results.first) { await storeBio(raw, credId, prfSalt, new Uint8Array(ext.results.first)); return true; }
  return async () => { await storeBio(raw, credId, prfSalt, await bioAssert(credId, prfSalt)); return true; };
}
async function unlockWithBio() {
  const b = readBio(), blob = readStore();
  if (!b || !blob) throw new Error('Face ID n’est pas activé.');
  const iter = checkBlob(blob);
  const secret = await bioAssert(fromB64(b.credId), fromB64(b.prfSalt));
  let raw;
  try { raw = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(b.iv) }, await prfKey(secret), fromB64(b.wrapped))); }
  catch { throw new Error('Face ID ne correspond plus à ce coffre. Utilisez le mot de passe maître.'); }
  const key = await keyFromRaw(raw); raw.fill(0);
  const entries = await openWithKey(blob, key, 'Face ID ne correspond plus à ce coffre. Utilisez le mot de passe maître.');
  return { key, raw: null, salt: fromB64(blob.salt), iter, entries };
}
const bioError = e => (e && e.name === 'NotAllowedError' ? 'Authentification annulée ou refusée.' : (e && e.message) || 'Erreur inconnue.');
function readStore() { try { return JSON.parse(localStorage.getItem(STORE)); } catch { return null; } }
async function persist(next) {
  if (!S.key) throw new Error('Le coffre est verrouillé.');
  if (S.busy) throw new Error('Une opération est déjà en cours. Réessayez dans un instant.');
  S.busy = true;
  const gen = S.gen;
  try {
    const blob = await seal(S.key, S.salt, S.iter, next);
    if (gen !== S.gen) throw new Error('Le coffre a été verrouillé pendant l’opération. Rouvrez-le pour vérifier son contenu.');
    try { localStorage.setItem(STORE, JSON.stringify(blob)); }
    catch { throw new Error('Enregistrement impossible (espace de stockage plein ?). Les données précédentes sont conservées.'); }
    S.entries = next;
  } finally { S.busy = false; }
}

// ---------- générateur de mots de passe (10 à 20 caractères distincts, 4 catégories) ----------
const GROUPS = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnopqrstuvwxyz', '23456789', '!@#$%&*+-=?'];
function randIndex(n) {
  const limit = 2 ** 32, accepted = limit - (limit % n), b = new Uint32Array(1);
  do crypto.getRandomValues(b); while (b[0] >= accepted);
  return b[0] % n;
}
function generatePassword(len) {
  len = Math.min(20, Math.max(10, len | 0));
  const out = GROUPS.map(g => g[randIndex(g.length)]);
  const all = GROUPS.join('');
  while (out.length < len) { const c = all[randIndex(all.length)]; if (!out.includes(c)) out.push(c); }
  for (let i = out.length - 1; i > 0; i--) { const j = randIndex(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return out.join('');
}

// ---------- répertoire A–Z ----------
const ALPHABET = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZ', '#'];
function sectionOf(name) {
  const n = name.trim().replace(/[œŒ]/g, 'O').replace(/[æÆ]/g, 'A').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  return /^[A-Z]/.test(n) ? n[0] : '#';
}
const compare = (a, b) => a.site.localeCompare(b.site, 'fr', { sensitivity: 'base', numeric: true }) || a.id.localeCompare(b.id);

// ---------- retour haptique ----------
// Safari sur iPhone n'a pas navigator.vibrate. En revanche, un interrupteur iOS
// (<input type="checkbox" switch>, iOS 17.4+) fait un « tic » quand le DOIGT le bascule.
// Un déclenchement par le code (pendant un glissement, par exemple) est ignoré par iOS :
// on pose donc un interrupteur invisible SOUS chaque lettre, que le doigt touche vraiment.
function haptic() { try { if (navigator.vibrate) navigator.vibrate(8); } catch {} } // Android
function hapticTarget(el) {
  const sw = h('input', { type: 'checkbox', switch: true, tabindex: '-1', 'aria-hidden': 'true',
    style: 'position:absolute;width:1px;height:1px;margin:0;visibility:hidden' });
  sw.addEventListener('click', ev => ev.stopPropagation());
  el.style.position = 'relative';
  el.append(h('label', { 'aria-hidden': 'true', style: 'position:absolute;inset:0;-webkit-tap-highlight-color:transparent' }, sw));
  return el;
}

// ---------- verrouillage automatique ----------
function lock(message) {
  S.gen++; S.key = null; S.entries = []; S.search = ''; S.busy = false;
  if (S.raw) S.raw.fill(0);
  S.raw = null;
  renderLock(message);
}
['pointerdown', 'keydown', 'input', 'touchmove'].forEach(ev => document.addEventListener(ev, () => { S.last = Date.now(); }, { passive: true, capture: true }));
document.addEventListener('scroll', () => { S.last = Date.now(); }, { passive: true, capture: true });
setInterval(() => { if (S.key && Date.now() - S.last > LOCK_MS) lock('Coffre verrouillé après 2 minutes sans activité.'); }, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.key && !S.keepOpen) lock();
  if (!document.hidden) { S.last = Date.now(); if (!S.key && S.autoBio) S.autoBio(); }
});
// iOS peut remettre l'app au premier plan sans « visibilitychange » : on écoute aussi ces événements.
['pageshow', 'focus'].forEach(ev => window.addEventListener(ev, () => { if (!S.key && S.autoBio) S.autoBio(); }));

// ---------- presse-papier ----------
async function copy(text, message) {
  if (!S.key) return;
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = h('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.append(t);
    t.select(); document.execCommand('copy'); t.remove();
  }
  toast(message);
}

// ---------- fichiers (sauvegardes) ----------
async function saveFile(name, type, content) {
  const file = new File([content], name, { type });
  S.keepOpen = true;
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
    const a = h('a', { href: URL.createObjectURL(file), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    return true;
  } catch (e) { if (e && e.name === 'AbortError') return false; throw e; }
  finally { setTimeout(() => { S.keepOpen = false; }, 1500); }
}
function pickFile(accept, onFile) {
  const input = h('input', { type: 'file', accept, style: 'display:none' });
  const done = () => { setTimeout(() => { S.keepOpen = false; }, 1500); input.remove(); };
  input.addEventListener('change', () => { done(); if (input.files[0]) onFile(input.files[0]); });
  input.addEventListener('cancel', done);
  document.body.append(input);
  S.keepOpen = true; input.click();
}
const today = () => new Date().toISOString().slice(0, 10);

// ---------- CSV (compatible Excel) ----------
const HEADERS = ['Nom du site', 'URL', 'Code client', 'Login', 'Mot de passe'];
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r?\n|\r/)[0] || '';
  const sep = (first.split(';').length >= first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], field = '', quoted = false, closed = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { quoted = false; closed = true; } }
      else field += c;
    } else if (c === sep) { row.push(field); field = ''; closed = false; }
    else if (c === '\n' || c === '\r') {
      row.push(field); rows.push(row); row = []; field = ''; closed = false;
      if (c === '\r' && text[i + 1] === '\n') i++;
    } else if (c === '"' && field === '' && !closed) quoted = true;
    else { if (closed || c === '"') throw new Error('CSV mal formé : guillemets incorrects.'); field += c; }
    if (rows.length > 10001) throw new Error('Maximum : 10 000 lignes.');
  }
  if (quoted) throw new Error('CSV incomplet : guillemet non fermé.');
  if (field !== '' || row.length || closed) { row.push(field); rows.push(row); }
  return rows;
}
function mapRows(table) {
  const rows = table.filter(r => r.some(v => v !== ''));
  if (!rows.length) throw new Error('Le fichier est vide.');
  const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const aliases = [['nomdusite', 'nomsite', 'site', 'nom'], ['url', 'adresse', 'adressedusite'], ['codeclient', 'client'], ['login', 'identifiant', 'identifiantlogin'], ['motdepasse', 'motsdepasse', 'password']];
  const header = rows[0].map(norm);
  const idx = aliases.map(names => {
    const m = header.map((v, i) => (names.includes(v) ? i : -1)).filter(i => i >= 0);
    if (m.length > 1) throw new Error('Plusieurs colonnes désignent le même champ. Gardez une seule colonne par champ.');
    return m.length ? m[0] : -1;
  });
  if (idx[0] < 0 || idx[3] < 0 || idx[4] < 0) throw new Error('En-têtes attendus : Nom du site, URL, Code client, Login, Mot de passe. Le site, le login et le mot de passe sont obligatoires.');
  const unprotect = v => (/^'[=+\-@]/.test(v) ? v.slice(1) : v);
  return rows.slice(1).map((r, line) => {
    const v = idx.map(i => (i >= 0 && i < r.length ? unprotect(r[i]) : ''));
    if (!v[0].trim() || !v[3].trim() || !v[4]) throw new Error(`Ligne ${line + 2} : site, login ou mot de passe manquant. Aucun import effectué.`);
    return { site: v[0].trim(), url: v[1].trim(), client: v[2], login: v[3].trim(), password: v[4] };
  });
}
function toCSV(entries) {
  // Une valeur commençant par = + - @ serait prise pour une formule par Excel : on la protège par une apostrophe.
  const cell = v => '"' + (/^[=+\-@]/.test(v) ? "'" + v : v).replace(/"/g, '""') + '"';
  const lines = [HEADERS, ...[...entries].sort(compare).map(e => [e.site, e.url, e.client, e.login, e.password])];
  return '﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n');
}
async function mergeEntries(incoming) {
  const key = e => JSON.stringify([e.site, e.url, e.client, e.login, e.password]);
  const seen = new Set(S.entries.map(key));
  const next = [...S.entries]; let added = 0;
  for (const e of incoming) { const k = key(e); if (!seen.has(k)) { seen.add(k); next.push({ ...clean(e), id: uid() }); added++; } }
  if (next.length > 10000) throw new Error('Le coffre dépasserait la limite de 10 000 fiches. Aucun import effectué.');
  if (added) await persist(next);
  return added;
}

  const info = message ? h('div', { class: 'muted small', text: message }) : null;

  const opened = r => {
    Object.assign(S, { key: r.key, raw: r.raw, salt: r.salt, iter: r.iter, entries: r.entries, last: Date.now() });
    S.busy = false; S.autoBio = null; renderList();
  };

    ev.preventDefault();
    if (S.busy) return;
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Ouverture…'; S.busy = true;
    const gen = S.gen;
    try {

  const bio = readBio();
  let bioPart = null;
  const pwCard = h('div', { class: 'card', style: 'text-align:left' }, form);
  if (bio) {
    const bioErr = h('div', { class: 'error', role: 'alert' });
    const bioBtn = h('button', { class: 'btn primary', text: '🙂 Ouvrir avec Face ID' });
    const tryBio = async userAsked => {
      if (S.busy || S.key) return;
      S.busy = true; bioErr.textContent = ''; bioBtn.disabled = true;
      const gen = S.gen;
      try { const r = await unlockWithBio(); if (gen !== S.gen) return; opened(r); }
      catch (e) { S.busy = false; bioBtn.disabled = false; if (userAsked || (e && e.name !== 'NotAllowedError')) bioErr.textContent = bioError(e); }
    };
    bioBtn.onclick = () => tryBio(true);
    // Lancement automatique de la demande Face ID (ouverture de l'app, retour dans l'app).
    // Pause de 3 s après chaque tentative : si vous annulez, la fenêtre ne revient pas en boucle.
    let lastAuto = 0;
    S.autoBio = () => {
      if (Date.now() - lastAuto < 3000 || document.hidden) return;
      lastAuto = Date.now();
      setTimeout(() => { if (!document.hidden) tryBio(false).finally(() => { lastAuto = Date.now(); }); }, 250);
    };
    pwCard.style.display = 'none';
    bioPart = [h('div', { class: 'card' }, bioBtn, bioErr),
      h('button', { class: 'link small', type: 'button', text: 'Utiliser le mot de passe maître', onclick: ev => {
        pwCard.style.display = ''; ev.target.remove(); p.input.focus(); } })];
  } else S.autoBio = null;

  show(h('div', { class: 'wrap hero' },

    installHint(), bioPart, pwCard, h('div', null, reset)));
  if (!bio && !isIOS()) p.input.focus();

// Proposition d'activer Face ID, affichée après une ouverture par mot de passe.

    yes.onclick = async () => {

function renderList() {
  const listEl = h('div', { class: 'list' });
  const rail = h('div', { class: 'rail', 'aria-label': 'Index alphabétique' });
  const search = h('input', { class: 'search', type: 'search', placeholder: 'Rechercher un site, un login…', value: S.search,
    autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
    oninput: () => { S.search = search.value; fill(); } });
  let selected = null, touched = null;
  function jump(letter, groups) {
    if (touched !== letter) { touched = letter; haptic(); } // un « tic » à chaque lettre franchie
    if (!groups[letter] || selected === letter) return;
    selected = letter;
    rail.querySelectorAll('b').forEach(b => b.classList.toggle('sel', b.dataset.l === letter));
    const target = document.getElementById('L-' + letter);
    if (target) target.scrollIntoView({ block: 'start' });
  }
  function fill() {
    const q = S.search.trim().toLocaleLowerCase('fr');
    const shown = S.entries.filter(e => !q || (e.site + ' ' + e.login + ' ' + e.url).toLocaleLowerCase('fr').includes(q)).sort(compare);
    const groups = {};
    for (const e of shown) (groups[sectionOf(e.site)] ||= []).push(e);
    const kids = [];
    if (!S.entries.length) {
      kids.push(h('div', { class: 'card' }, h('div', { style: 'font-size:34px', text: '🔑' }), h('h2', { text: 'Votre coffre est prêt' }),
        h('p', { class: 'muted', text: 'Ajoutez votre premier site pour le retrouver dans ce répertoire, ou importez une sauvegarde depuis ⚙︎.' }),
        h('button', { class: 'btn primary', text: '+ Ajouter mon premier site', onclick: () => renderEdit(null) })));
    } else if (!shown.length) kids.push(h('div', { class: 'card muted', text: 'Aucun site ne correspond à votre recherche.' }));
    for (const L of ALPHABET) if (groups[L]) {
      kids.push(h('div', { class: 'letter', id: 'L-' + L, text: L }));
      for (const e of groups[L]) kids.push(h('button', { class: 'site', 'aria-label': 'Ouvrir le site ' + e.site, onclick: () => renderDetail(e.id) }, h('span', { text: e.site })));
    }
    listEl.replaceChildren(...kids);
    rail.replaceChildren(...ALPHABET.map(L => hapticTarget(h('b', { 'data-l': L, class: groups[L] ? 'on' : '', text: L }))));
    rail.style.display = S.entries.length ? '' : 'none';
    const pick = (x, y) => { const el = document.elementFromPoint(x, y), b = el && el.closest && el.closest('[data-l]'); if (b) jump(b.dataset.l, groups); };
    // Pas de preventDefault au premier contact : sinon iOS n'envoie pas l'appui à l'interrupteur (pas de tic).
    // La page ne défile pas pour autant (touch-action: none sur la barre).
    rail.ontouchstart = ev => { const t = ev.touches[0]; pick(t.clientX, t.clientY); };
    rail.ontouchmove = ev => { ev.preventDefault(); const t = ev.touches[0]; pick(t.clientX, t.clientY); };
    rail.onmousedown = ev => pick(ev.clientX, ev.clientY);
    rail.ontouchend = rail.ontouchcancel = () => { selected = null; touched = null; };
    rail.onmouseup = () => { touched = null; };
  }
  const header = h('header', { class: 'bar' }, h('div', { class: 'wrap' },
    h('div', { class: 'row' },
      h('h1', { text: 'Mon Coffre' }),
      h('button', { class: 'icon-btn', 'aria-label': 'Réglages et sauvegardes', text: '⚙︎', onclick: renderSettings }),
      h('button', { class: 'icon-btn', 'aria-label': 'Verrouiller', text: '🔒', onclick: () => lock() }),
      h('button', { class: 'icon-btn', 'aria-label': 'Ajouter un site', style: 'color:var(--green);font-weight:700', text: '+', onclick: () => renderEdit(null) })),
    search));
  fill();
  show(header, h('div', { class: 'wrap' }, bioOffer(), listEl), rail);
}

function renderSettings() {
  const msg = h('div', { role: 'status' });
  const say = (text, ok) => { msg.className = ok ? 'ok' : 'error'; msg.textContent = text; };
  const run = fn => async (...args) => { msg.textContent = ''; try { await fn(...args); } catch (e) { say(e.message, false); } };

  // Sauvegarde chiffrée
  const exportEnc = run(async () => {
    const blob = readStore();
    if (await saveFile(`MonCoffre-sauvegarde-${today()}.moncoffre`, 'application/json', JSON.stringify(blob)))
      say('Sauvegarde chiffrée créée. Gardez-la dans Fichiers / iCloud Drive : elle s’ouvre avec votre mot de passe maître actuel.', true);
  });
  const importBox = h('div');
  const importEnc = () => pickFile('.moncoffre,.json,application/json', file => {
    const p = pwField('Mot de passe de cette sauvegarde', { autocomplete: 'off' });

      if (file.size > 20e6) throw new Error('Fichier trop volumineux.');
      let blob; try { blob = JSON.parse(await file.text()); } catch { throw new Error('Fichier de sauvegarde non reconnu.'); }
      go.disabled = true;
      try { const r = await unseal(blob, p.input.value); const n = await mergeEntries(r.entries); importBox.replaceChildren(); say(`${n} fiche(s) ajoutée(s) (les doublons sont ignorés).`, true); }
      finally { go.disabled = false; }
    }) });
    importBox.replaceChildren(h('p', { class: 'small', text: 'Fichier : ' + file.name }), p.node, go);
  });

  // CSV / Excel
  const importCSV = () => pickFile('.csv,text/csv', run(async file => {
    if (file.size > 8e6) throw new Error('Fichier trop volumineux (maximum 8 Mo).');
    const n = await mergeEntries(mapRows(parseCSV(await file.text())));
    say(`${n} fiche(s) ajoutée(s) depuis le CSV (les doublons sont ignorés).`, true);
  }));
  const exportCSV = run(async () => {
    if (!confirm('Le fichier CSV contiendra tous vos mots de passe EN CLAIR, lisibles par quiconque y a accès. Continuer ?')) return;
    if (await saveFile(`MonCoffre-${today()}.csv`, 'text/csv', toCSV(S.entries))) say('Fichier CSV créé. Supprimez-le dès que vous n’en avez plus besoin.', true);
  });

  // Face ID
  const bioCard = h('div', { class: 'card' });
  function renderBioSection() {
    const title = h('h3', { style: 'margin-top:0', text: 'Face ID / code de l’iPhone' });

        } }));
      return;
    }
    const p = pwField('Mot de passe maître', { autocomplete: 'current-password' });
    const go = h('button', { class: 'btn', text: 'Activer Face ID' });
    go.onclick = run(async () => {
      if (!(await bioSupported())) throw new Error('Cet appareil ne permet pas Face ID pour Mon Coffre (iOS 18 ou plus récent requis, depuis l’icône installée).');
      go.disabled = true;
      try {
        const r = await unseal(readStore(), p.input.value); // vérifie le mot de passe
        let res = await enableBio(r.raw);
        if (res !== true) {
          go.textContent = 'Dernière étape : confirmer avec Face ID'; go.disabled = false;
          go.onclick = run(async () => { go.disabled = true; try { await res(); r.raw.fill(0); renderBioSection(); say('Face ID activé.', true); } finally { go.disabled = false; } });
          return;
        }
        r.raw.fill(0); renderBioSection(); say('Face ID activé.', true);
      } catch (e) { go.disabled = false; throw new Error(bioError(e)); }
    });
    bioCard.replaceChildren(title, h('p', { class: 'small muted', text: 'Ouvrez le coffre avec Face ID au lieu du mot de passe maître. Le mot de passe maître reste le moyen de secours.' }), p.node, go);
  }
  renderBioSection();

  // Changer le mot de passe maître
  const cur = pwField('Mot de passe maître actuel', { autocomplete: 'current-password' });
  const n1 = pwField('Nouveau mot de passe (10 caractères minimum)', { autocomplete: 'new-password' });
  const n2 = pwField('Confirmez le nouveau mot de passe', { autocomplete: 'new-password' });
  const change = h('button', { class: 'btn', text: 'Changer le mot de passe maître', onclick: run(async () => {
    if (n1.input.value.length < 10) throw new Error('Choisissez au moins 10 caractères.');
    if (n1.input.value !== n2.input.value) throw new Error('Les deux nouveaux mots de passe ne sont pas identiques.');
    change.disabled = true;
    try {
      await unseal(readStore(), cur.input.value); // vérifie l'ancien mot de passe
      const salt = rand(16), raw = await deriveRaw(n1.input.value, salt, ITER), key = await keyFromRaw(raw);
      const old = { key: S.key, salt: S.salt, iter: S.iter };
      Object.assign(S, { key, salt, iter: ITER });
      try { await persist(S.entries); } catch (e) { Object.assign(S, old); throw e; }
      const hadBio = !!localStorage.getItem(BIO);
      localStorage.removeItem(BIO); // l'ancien lien Face ID ne correspond plus au nouveau mot de passe
      S.raw = raw; S.bioOfferHidden = false;
      [cur, n1, n2].forEach(f => { f.input.value = ''; });
      say('Mot de passe maître changé. ' + (hadBio ? 'Réactivez Face ID ci-dessous. ' : '') + 'Pensez à refaire une sauvegarde chiffrée.', true);
      renderBioSection();
    } finally { change.disabled = false; }
  }) });

  show(
    h('header', { class: 'bar' }, h('div', { class: 'wrap row' }, h('button', { class: 'back', text: '‹ Répertoire', onclick: renderList }))),
    h('div', { class: 'wrap' },
      h('h1', { style: 'margin:20px 0 0', text: 'Réglages' }),
      h('p', { class: 'muted', text: `${S.entries.length} fiche(s) dans le coffre.` }),
      msg,
      h('div', { class: 'card' },
        h('h3', { style: 'margin-top:0', text: 'Sauvegarde chiffrée (recommandé)' }),
        h('p', { class: 'small muted', text: 'Le coffre n’existe que sur cet appareil. Exportez régulièrement une sauvegarde et rangez-la dans Fichiers ou iCloud Drive. Elle reste chiffrée par votre mot de passe maître.' }),
        h('div', { class: 'row-btns' },
          h('button', { class: 'btn', text: '⬆︎ Exporter une sauvegarde', onclick: exportEnc }),
          h('button', { class: 'btn', text: '⬇︎ Ajouter depuis une sauvegarde', onclick: importEnc })),
        importBox),
      h('div', { class: 'card' },
        h('h3', { style: 'margin-top:0', text: 'Excel (CSV)' }),
        h('p', { class: 'small muted', text: 'Colonnes : Nom du site ; URL ; Code client ; Login ; Mot de passe. Dans Excel : Fichier › Enregistrer sous › CSV UTF-8.' }),
        h('div', { class: 'row-btns' },
          h('button', { class: 'btn', text: '⬇︎ Importer un CSV', onclick: importCSV }),
          h('button', { class: 'btn danger', text: '⬆︎ Exporter en CSV (non chiffré)', onclick: exportCSV }))),
      bioCard,
      h('div', { class: 'card' },
        h('h3', { style: 'margin-top:0', text: 'Mot de passe maître' }), cur.node, n1.node, n2.node, change),
      h('div', { class: 'card small muted' },
        h('h3', { style: 'margin-top:0;color:var(--text)', text: 'Sécurité' }),
        h('p', { text: 'Chiffrement AES-256 ; clé tirée du mot de passe maître (600 000 tours PBKDF2). Aucune donnée n’est envoyée sur Internet.' }),
        h('p', { text: 'Le coffre se verrouille quand vous quittez l’application ou après 2 minutes sans activité.' }))));
}

// ---------- démarrage ----------
// Mise à jour automatique : à chaque ouverture / retour dans l'app, on demande s'il existe une
// nouvelle version ; si oui, la page se recharge (seulement si le coffre est verrouillé).
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    if (S.key) { S.updatePending = true; return; } // ne pas fermer un coffre ouvert
    reloading = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (S.updatePending && !S.key) { location.reload(); return; }
      reg.update().catch(() => {});
    });
  }).catch(() => {});
}
if (!window.crypto || !crypto.subtle) {
  show(h('div', { class: 'wrap hero' }, h('h1', { text: 'Mon Coffre' }),
    h('p', { class: 'error', text: 'Cette page doit être ouverte depuis une adresse sécurisée (https://) pour pouvoir chiffrer vos données.' })));
} else if (readStore()) { renderLock(); if (S.autoBio) S.autoBio(); } else renderSetup();
</script>
</body>
</html>
